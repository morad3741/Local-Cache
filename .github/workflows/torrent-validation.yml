name: Torrent validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torrent-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Policy checks
        run: bash tools/check-torrent-policy.sh
      - name: JVM tests, APK, instrumentation compilation and lint
        working-directory: android
        run: bash ./gradlew :app:testStandardDebugUnitTest :app:assembleStandardDebug :app:assemblePersonalDebugAndroidTest :app:lintStandardDebug --stacktrace
      - name: Real seeder JNI regressions
        working-directory: android
        run: bash ./gradlew -PtorrentNativeTests=true :app:testStandardDebugUnitTest --tests app.localcache.torrent.TorrentNativeTest --rerun-tasks --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torrent-validation-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
